<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Deep Space Cyber Gradient Background -->
    <radialGradient id="bgGlow" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#181336" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Animated Shimmer Gradient for Brand Name -->
    <linearGradient id="shimmerBrand" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#00F2FE" />
      <animate attributeName="x1" from="-100%" to="100%" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="300%" dur="5.5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Data Stream Gradient -->
    <linearGradient id="dataHighway" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.2" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes scanSweep {
      0% { transform: translateY(-40px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes pulseLed {
      0%, 100% { fill: #10B981; opacity: 1; filter: drop-shadow(0 0 8px #10B981); }
      50% { fill: #34D399; opacity: 0.45; filter: drop-shadow(0 0 2px #10B981); }
    }
    @keyframes particleMove1 {
      0% { cx: 120; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 1080; opacity: 0; }
    }
    @keyframes particleMove2 {
      0% { cx: 1080; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 120; opacity: 0; }
    }
    @keyframes telemetryPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .scan-beam { animation: scanSweep 5s ease-in-out infinite; }
    .status-led { animation: pulseLed 2s infinite; }
    .packet-fwd { animation: particleMove1 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .packet-rev { animation: particleMove2 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .telemetry-txt { animation: telemetryPulse 3s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGlow)" />
  <rect width="1200" height="360" fill="url(#cyberGrid)" />

  <!-- Outer Cyber Border -->
  <rect x="14" y="14" width="1172" height="332" rx="14" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

  <!-- Corner Brackets -->
  <path d="M 14 50 L 14 14 L 50 14" stroke="#00F2FE" stroke-width="3.5" fill="none" filter="url(#neonCyan)" />
  <path d="M 1186 50 L 1186 14 L 1150 14" stroke="#00F2FE" stroke-width="3.5" fill="none" filter="url(#neonCyan)" />
  <path d="M 14 310 L 14 346 L 50 346" stroke="#C084FC" stroke-width="3.5" fill="none" filter="url(#neonPurple)" />
  <path d="M 1186 310 L 1186 346 L 1150 346" stroke="#C084FC" stroke-width="3.5" fill="none" filter="url(#neonPurple)" />

  <!-- Laser Scanline Sweeper -->
  <line x1="14" y1="0" x2="1186" y2="0" stroke="rgba(0, 242, 254, 0.55)" stroke-width="2.5" class="scan-beam" filter="url(#neonCyan)" />

  <!-- Header Status Pill -->
  <g transform="translate(48, 38)">
    <rect width="190" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" class="status-led" />
    <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#93C5FD" letter-spacing="1.5">
      CORE ENGINE READY
    </text>
  </g>

  <!-- Right Telemetry Badge -->
  <g transform="translate(980, 38)">
    <rect width="170" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
    <text x="14" y="18" class="telemetry-txt" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1">
      60 FPS // ZERO ROT
    </text>
  </g>

  <!-- Center Typography -->
  <!-- Sub-label -->
  <text x="600" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#38BDF8" letter-spacing="6">
    BSFRAMEWORKS // PRODUCTION SUITE
  </text>

  <!-- Main Title -->
  <text x="600" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="58" font-weight="900" fill="url(#shimmerBrand)" letter-spacing="5">
    MEDIAFLOW STUDIO
  </text>

  <!-- Tagline -->
  <text x="600" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="3.5">
    ENTERPRISE INGESTION • SYNC • METADATA FUSION &amp; REPORTING
  </text>

  <!-- Particle Highway (Data Stream) -->
  <line x1="120" y1="264" x2="1080" y2="264" stroke="url(#dataHighway)" stroke-width="2.5" />
  <circle class="packet-fwd" cy="264" r="5" fill="#00F2FE" filter="url(#neonCyan)" />
  <circle class="packet-rev" cy="264" r="4.5" fill="#FF2E93" filter="url(#neonPurple)" />

  <!-- Footprint specs badges -->
  <g transform="translate(0, 298)">
    <!-- Node 1 -->
    <text x="260" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">
      [ PHOTO MATCHER ]
    </text>
    <!-- Node 2 -->
    <text x="490" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">
      [ PV SEPARATOR ]
    </text>
    <!-- Node 3 -->
    <text x="710" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">
      [ EXCEL FUSION ]
    </text>
    <!-- Node 4 -->
    <text x="940" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">
      [ INVENTORY SCANNER ]
    </text>
  </g>
</svg>

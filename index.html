<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/icon.png" />
    <title>MediaFlow Studio — Creative Production Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Standalone Splash mode: 100% transparent desktop background */
      html.splash-mode,
      body.splash-mode,
      .splash-mode,
      .splash-mode #root,
      .splash-mode #root:empty {
        background: transparent !important;
        background-color: transparent !important;
        box-shadow: none !important;
      }
      .splash-mode #root:empty::after {
        display: none !important;
      }
    </style>
    <script>
      (function() {
        var isSplash = window.location.search.includes('splash') ||
                       window.location.hash.includes('splash') ||
                       (window.process && window.process.argv && window.process.argv.includes('--window-type=splash'));
        if (isSplash) {
          document.documentElement.classList.add('splash-mode');
          document.documentElement.style.background = 'transparent';
          document.documentElement.style.backgroundColor = 'transparent';
        }
      })();
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <script>
      (function() {
        var isSplash = window.location.search.includes('splash') ||
                       window.location.hash.includes('splash') ||
                       (window.process && window.process.argv && window.process.argv.includes('--window-type=splash'));
        if (isSplash) {
          document.body.classList.add('splash-mode');
          document.body.style.background = 'transparent';
          document.body.style.backgroundColor = 'transparent';
          return;
        }
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light') {
            document.body.style.backgroundColor = '#FFFFFF';
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.body.style.backgroundColor = '#131722';
          }
        } catch(e) {}
      })();
      window.hideAppSplash = function() {};
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
